[project]
name = "osbuild"
version = "0.1.0"
description = "The GothRTOS build system"
readme = "README.md"
authors = [
    { name = "thepanoc95", email = "oakymacintosh@duck.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyfiglet>=1.0.4",
    "textual>=8.2.8",
]

[project.scripts]
gothrtos = "gothrtos:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

TIMEOUT 30
DEFAULT 1

MENU GothRTOS
    kernel /kern.ldr
    cmdline -kern_sym=/kern.symbols -verbose=1 -root=/img/root.bin -mem=dynamic -drv_root=/kern.builts
    console /kern::\namespace\lua\display.lua:lcd::<0
    dtb /img/device.dtb

MENU Advanced
    kernel /kern.ldr
    cmdline -kern_sym=/kern.symbols -verbose=1 -root=/img/root.bin -mem=dynamic -drv_root=/kern.builts -debug=0x01
    console /kern::\namespace\lua\display.lua:lcd::<0
    dtb /img/device.dtb
    debug /kern::\namespace\lua\debug.lua:uart::<1 - debug=0x01 -set-gdb=1 -set-serial=1 -set-serial-baud=115200
    boot_namespce /kern::\namespace\class\bootldr.dev <<%1 & 2>&1 to /kern::\ldr.95exc
    debugbin /debug/SystemDebug.95exc ++ /kern::\sys\debug.daemon.class

MENU Memtest
    kernel /memtest.bin
    dtb /img/device.dtb
    console generic::/soc/display/uart@0x3f201000:uart

